services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    networks:
      - app-net


  fastapi:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-net
    volumes:
      - ./uploads:/app/uploads
      - ./model:/app/model
      - .:/app


  nginx:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  mongo_data:
